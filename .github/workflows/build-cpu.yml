name: build-cpu

on:
  push:
    branches:
      - master
      - devel

jobs:
  build:
    runs-on: ubuntu-latest
    env:
       PYTHONPATH: "/home/runner/work/pscfpp/pscfpp/lib/python"
    steps:
    - run: sudo apt-get -y install libfftw3-dev
    - run: sudo apt-get -y install libgsl-dev
    - uses: actions/setup-python@v6
    - run: echo $PYTHONPATH
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - run: ./configure
    - run: ls 
    - run: cd bld; make all
    - run: cd bld/pscf/tests; make run
    - run: cd bld/r1/tests; make run
    - run: cd bld/rp/tests/cpp; make run
